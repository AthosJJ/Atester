  <script>
    /* Thème appliqué avant le premier rendu (évite un flash clair en mode sombre). */
    try {
      var t = JSON.parse(localStorage.getItem('a-tester:theme') || 'null');
      var d = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
      if (t) document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-scheme', d ? 'dark' : 'light');
    } catch (e) {}
  </script>

      <section class="view push" id="view-reglages" aria-label="Réglages" hidden></section>
    </main>
